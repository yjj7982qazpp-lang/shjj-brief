name: Promote Preview to Main

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to promote into main"
        required: true
        default: "feature/v3-law-detail-cards"
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch source branch
        run: |
          git fetch origin "${{ inputs.source_branch }}"

      - name: Merge source branch into main
        run: |
          git merge --no-ff "origin/${{ inputs.source_branch }}" -m "Promote ${{ inputs.source_branch }} to main"

      - name: Normalize production labels
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          // Process index.html
          const indexPath = 'index.html';
          const indexContent = fs.readFileSync(indexPath, 'utf8');
          const normalizedIndex = indexContent.replace(
            /<title>SHJJ Brief - Preview [^<]*<\/title>/g,
            '<title>SHJJ Brief - MAIN</title>'
          );
          fs.writeFileSync(indexPath, normalizedIndex, 'utf8');
          console.log('✓ Normalized index.html title');
          
          // Process manifest.json if it has preview labels
          const manifestPath = 'manifest.json';
          const manifestContent = fs.readFileSync(manifestPath, 'utf8');
          const manifest = JSON.parse(manifestContent);
          
          let modified = false;
          if (manifest.name && manifest.name.match(/Preview/i)) {
            manifest.name = 'SHJJ Brief - MAIN';
            modified = true;
          }
          if (manifest.short_name && manifest.short_name.match(/Preview/i)) {
            manifest.short_name = 'SHJJ Brief';
            modified = true;
          }
          
          if (modified) {
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n', 'utf8');
            console.log('✓ Normalized manifest.json');
          } else {
            console.log('✓ manifest.json already in production state');
          }
          "

      - name: Validate app.js
        run: |
          node --check app.js

      - name: Validate law updates JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/law_updates.json','utf8')); console.log('JSON_OK')"

      - name: Push main
        run: |
          git push origin main
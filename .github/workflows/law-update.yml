name: Auto Law Brief Update

on:
  schedule:
    # 09:20 KST = 00:20 UTC
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-law-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect law brief data with AI cost guard
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL }}
          PYTHONUNBUFFERED: "1"
        run: python -u .github/scripts/collect_law_updates.py

      - name: Inspect generated changes
        run: git status --short

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/law_updates.json data/law_summary_cache.json
          if git diff --cached --quiet; then
            echo "No legal data or summary cache changes to commit"
          else
            git commit -m "Auto update law brief data"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

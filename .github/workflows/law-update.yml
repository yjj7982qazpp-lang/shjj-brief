name: Auto Law Brief Update

on:
  schedule:
    # 09:20 KST = 00:20 UTC
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-law-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect law brief data and write automation status
        id: collect
        continue-on-error: true
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL }}
          OPENAI_ESTIMATED_COST_PER_CALL_USD: ${{ vars.OPENAI_ESTIMATED_COST_PER_CALL_USD }}
          PYTHONUNBUFFERED: "1"
        run: python -u .github/scripts/run_law_update_with_status.py

      - name: Inspect generated changes
        if: always()
        run: git status --short

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/law_updates.json data/law_summary_cache.json data/automation_status.json
          if git diff --cached --quiet; then
            echo "No legal data, summary cache, or automation status changes to commit"
          else
            git commit -m "Auto update law brief data"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail workflow if collection failed
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1

name: AI Development Loop

on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  run-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openai

      - name: Run AI Development Loop
        id: loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_DEV_SLOT: ${{ github.event_name == 'workflow_dispatch' && 'manual' || '' }}
        run: python .github/scripts/ai_development_loop.py

      - name: Create issue brief comment
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.loop.outputs.issue_title }}
          REPORT_PATH: ${{ steps.loop.outputs.report_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.ISSUE_TITLE || '[AI Lab] Development Loop Reports';
            const reportPath = process.env.REPORT_PATH;

            let body = 'AI Development Loop 보고서 생성';
            if (reportPath && fs.existsSync(reportPath)) {
              body = fs.readFileSync(reportPath, 'utf8');
            }

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });

            let issue = existingIssues.find((item) => !item.pull_request && item.title === title);

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: 'AI Development Loop 보고서를 댓글로 누적 기록합니다. 이 이슈는 홈페이지 배포를 유발하지 않는 보고서 보관함입니다.',
              });
              issue = created.data;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

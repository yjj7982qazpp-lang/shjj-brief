name: AI Development Loop

on:
  schedule:
    # 00:20 UTC = 09:20 KST
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openai

      - name: Run AI Development Loop
        id: loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_DEV_SLOT: ${{ github.event_name == 'workflow_dispatch' && 'manual' || '' }}
        run: python .github/scripts/ai_development_loop.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai_lab/idea_state.json data/ai_lab/daily/*.md
          git commit -m "chore: run ai development loop"
          git push

      - name: Create issue brief
        if: steps.loop.outputs.should_create_issue == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.loop.outputs.issue_title }}
          REPORT_PATH: ${{ steps.loop.outputs.report_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = process.env.ISSUE_TITLE || '[AI DEV] 자동 디벨롭 브리프';
            const reportPath = process.env.REPORT_PATH;
            let body = 'AI Development Loop 보고서 생성';
            if (reportPath && fs.existsSync(reportPath)) {
              body = fs.readFileSync(reportPath, 'utf8');
            }
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title.replace(/"/g, '\\"')}"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });
            if (existing.data.total_count > 0) {
              core.info(`Issue already exists: ${title}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

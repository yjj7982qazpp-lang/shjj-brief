name: Playwright Smoke Test

# Automatic triggers disabled. Manual execution only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: https://www.shjjbrief.com
        run: |
          npx playwright test tests/playwright-smoke.spec.mjs
          npx playwright test tests/playwright-admin-ui.spec.mjs

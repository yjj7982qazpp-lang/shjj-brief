name: Playwright Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # KST 06:00
    - cron: '0 5 * * *'  # KST 14:00

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: https://www.shjjbrief.com
        run: npx playwright test tests/playwright-smoke.spec.mjs --project=chromium
